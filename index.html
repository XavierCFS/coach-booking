<script>
function __show(m){var a=document.getElementById("app");if(a)a.innerHTML='<h1>發生錯誤</h1><p class="sm2" style="word-break:break-all">'+String(m).replace(/</g,"&lt;")+'</p>';}
window.addEventListener("error",e=>__show((e.message||"error")+" (line "+(e.lineno||"?")+")"));
window.addEventListener("unhandledrejection",e=>__show((e.reason&&e.reason.message)||e.reason));
</script>
<script>
const CONFIG={LIFF_ID:"2011857437-xFUbKdAg"};
/* 資料層：目前存在本機瀏覽器；上線請把 load/save 換成 Supabase / Firebase */
const blank=()=>({coach:null,students:{},packages:[],lessons:[],requests:[],notes:[],cfg:{maxDays:30,place:""}});
const store={load(){try{return JSON.parse(localStorage.getItem("cb_db"))||blank()}catch(e){return blank()}},save(d){localStorage.setItem("cb_db",JSON.stringify(d))}};
let db=store.load(),S={uid:null,coachMode:false,demo:!CONFIG.LIFF_ID,cv:"d",cd:new Date(),more:false,tmp:null,exp:{},hist:false,tab:"",pk:{},bk:null},FIRST=true;
const WD="日一二三四五六",p2=n=>String(n).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const rid=()=>Math.random().toString(36).slice(2,10);
const hm=d=>{d=new Date(d);return p2(d.getHours())+":"+p2(d.getMinutes())};
const md=d=>{d=new Date(d);return `${d.getMonth()+1}/${d.getDate()} 週${WD[d.getDay()]}`};
const fmt=d=>md(d)+" "+hm(d);
const sameD=(a,b)=>new Date(a).toDateString()==new Date(b).toDateString();
const loc=d=>{const o=new Date(d-d.getTimezoneOffset()*6e4);return o.toISOString().slice(0,16)};
const gcal=l=>{const z=x=>new Date(x).toISOString().replace(/[-:]|\.\d{3}/g,"");const e=new Date(+new Date(l.start)+36e5);
return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("教練課")}&dates=${z(l.start)}/${z(e)}&location=${encodeURIComponent(l.place||"")}`};
const commit=()=>{store.save(db);render()};
const TH=()=>{const u=S.coachMode?db.coach:db.students[S.uid];return(u&&u.theme)||S.tmp||"r"};
/* 扣課：已完成的課從最早的期數開始；已預約的課接在後面 */
function stats(sid){let done=db.lessons.filter(l=>l.sid===sid&&l.status==="done").sort((a,b)=>a.start.localeCompare(b.start)),sc=db.lessons.filter(l=>l.sid===sid&&l.status==="scheduled").length;
return db.packages.filter(p=>p.sid===sid).sort((a,b)=>a.term-b.term).map(p=>{const used=done.slice(0,p.total);done=done.slice(p.total);const book=Math.min(p.total-used.length,sc);sc-=book;return{...p,used,book,remain:p.total-used.length}})}
const remainOf=sid=>stats(sid).reduce((n,p)=>n+p.remain,0);
/* ===== 預約規則：開放時段、固定不可約、休假日 ===== */
const LEN=60,cfg=()=>Object.assign({open:"08:00",close:"22:00",blocks:[],offWd:[],offDates:[]},db.cfg);
const tm=s=>{const[a,b]=s.split(":");return +a*60+ +b},fm=m=>p2(Math.floor(m/60))+":"+p2(m%60);
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
function slots(ds){const c=cfg(),d=new Date(ds+"T00:00"),w=d.getDay();if(c.offDates.includes(ds)||c.offWd.includes(w))return[];
const busy=db.lessons.filter(l=>l.status==="scheduled"&&sameD(l.start,d)).map(l=>{const x=new Date(l.start);return x.getHours()*60+x.getMinutes()}),n=new Date(),nowM=sameD(d,n)?n.getHours()*60+n.getMinutes():-1,o=[];
for(let m=tm(c.open);m<=tm(c.close)-LEN;m+=30){if(m<=nowM)continue;
if(c.blocks.some(b=>(b.wd==="*"||+b.wd===w)&&m<tm(b.to)&&m+LEN>tm(b.from)))continue;
if(busy.some(x=>m<x+LEN&&m+LEN>x))continue;o.push(fm(m))}return o}
const okSlot=iso=>{const x=new Date(iso);return slots(ymd(x)).includes(hm(x))};
const tsel=(n,v,a=360,z=1410,ph=0)=>{let o=ph?'<option value="">時間</option>':"";for(let m=a;m<=z;m+=30)o+=`<option ${fm(m)===v?"selected":""}>${fm(m)}</option>`;return `<select name="${n}">${o}</select>`};
function rule(){const c=cfg(),t=ymd(new Date()),od=c.offDates.filter(x=>x>=t).slice(0,5);return `<li>每天 ${c.open}–${c.close} 可預約，每 30 分鐘一個時段</li><li>每堂 ${LEN} 分鐘</li>`+(c.offWd.length?`<li>固定休假：${[1,2,3,4,5,6,0].filter(w=>c.offWd.includes(w)).map(w=>"週"+WD[w]).join("、")}</li>`:"")+(od.length?`<li>指定休假日：${od.map(x=>x.slice(5).replace("-","/")).join("、")}</li>`:"")}
function picker(){const D=[];for(let i=0;i<=(db.cfg.maxDays||30);i++){const d=new Date();d.setDate(d.getDate()+i);if(slots(ymd(d)).length)D.push([ymd(d),md(d)])}
if(!D.length)return `<div class="empty">目前沒有可預約的日期，請聯絡教練。</div>`;

for(let i=0;i<7;i++){const d=new Date(w0);d.setDate(w0.getDate()+i);h+=`<div class="wc${sameD(d,new Date())?" td":""}" data-act="goto" data-d="${d.toISOString()}"><b>${WD[d.getDay()]}</b><span class="sm2">${d.getDate()}</span>`+on(d).map(l=>`<div class="chip ${l.status==="done"?"d":"b"}">${hm(l.start)}<br>${sn(l.sid).slice(0,3)}</div>`).join("")+`</div>`}
const e=new Date(w0);e.setDate(e.getDate()+6);cal=`<div class="nav">${nb(-1)}<b>${w0.getMonth()+1}/${w0.getDate()} – ${e.getMonth()+1}/${e.getDate()}</b>${nb(1)}</div><div class="wk">${h}</div><div class="sm2">點選日期可看當天明細</div>`}
else{const m0=new Date(cd.getFullYear(),cd.getMonth(),1),off=(m0.getDay()+6)%7,n=Math.ceil((off+new Date(cd.getFullYear(),cd.getMonth()+1,0).getDate())/7)*7;let h=WD.split("").map((x,i)=>"").join("");
h="一二三四五六日".split("").map(x=>`<div style="text-align:center;font:700 13px var(--fs)">${x}</div>`).join("");
for(let i=0;i<n;i++){const d=new Date(m0);d.setDate(1-off+i);const L=on(d),inm=d.getMonth()===m0.getMonth();h+=`<div class="mc${inm?"":" x"}${sameD(d,new Date())?" td":""}" data-act="goto" data-d="${d.toISOString()}"><span>${d.getDate()}</span>${L.length?stp(L.length,L.some(l=>l.status==="scheduled")?"b":"d"):""}</div>`}
cal=`<div class="nav">${nb(-1)}<b>${m0.getFullYear()} 年 ${m0.getMonth()+1} 月</b>${nb(1)}</div><div class="mo">${h}</div><div class="sm2">${stp("完","d").replace('class="stp','class="stp" style="width:16px;height:16px;font-size:9px;vertical-align:middle" data-x="')} 已上完　${stp("預","b").replace('class="stp','class="stp" style="width:16px;height:16px;font-size:9px;vertical-align:middle" data-x="')} 已預約　（圈內＝堂數）</div>`}
const stu=Object.entries(db.students).map(([id,s])=>{const pk=stats(id),notes=db.notes.filter(n=>n.sid===id).sort((a,b)=>b.ts-a.ts);
return blk("s"+id,esc(s.name),rows([["電話",esc(s.phone)],["性別",s.gender],["生日",s.birthday||"—"]])+`<h4>期數與繳費</h4>`+(pk.map(p=>blk("p"+p.id,`第 ${p.term} 期`,rows([["教練費","$"+p.fee],["付款日期",p.paid],["付款方式",esc(p.method)]])+(p.used.length?p.used.map(l=>`<div class="row"><span>${stp("完","d")}　已上</span><span>${fmt(l.start)}</span></div>`).join(""):`<div class="empty">尚未上課</div>`),`剩 ${p.remain}/${p.total}`)).join("")||`<div class="empty">尚無期數</div>`)+
`<div data-f data-sid="${id}"><h4>新增期數</h4>${field("fee","教練費","number")}${field("total","堂數","number")}${field("paid","付款日期","date",loc(new Date()).slice(0,10))}${field("method","付款方式","text","轉帳")}<button class="btn" data-act="addPkg">新增期數</button></div>`+
`<div data-f data-sid="${id}"><h4>直接排課</h4>${field("sd","日期","date")}<label>時間</label>${tsel("st","",360,1410,1)}${field("place","地點","text",db.cfg.place)}<button class="btn g" data-act="addLesson">排課</button></div>`+
`<h4>備注</h4>`+notes.map(n=>`<div class="row"><span>${esc(n.text)}</span><span class="sm2">${new Date(n.ts).toLocaleDateString("zh-TW")}</span></div>`).join("")+`<div data-f data-sid="${id}"><textarea name="text" rows="2" placeholder="新增備注"></textarea><button class="btn g" data-act="addNote">新增備注</button></div>`,`剩 ${remainOf(id)} 堂`)}).join("")||`<div class="empty">還沒有學員。請學員從學員連結進入並建立資料。</div>`;
const pend=db.requests.filter(r=>r.status==="pending");
const seg=[["d","日"],["w","週"],["m","月"]].map(([k,n])=>`<button class="${S.cv===k?"on":""}" data-act="cv" data-v="${k}">${n}</button>`).join("");
const head=hello(`${esc(c.nick||c.name)}教練，早安！`,"今天也陪學員，進步一點點。",ic("dump",28));
const pg=t=>brand("教練區")+`<h1 class="pg">${t}</h1>`;
if(S.tab==="req")return pg("約課申請")+reqCards();
if(S.tab==="stu")return pg("我的學員")+(stu.includes("blk")?stu:"");
if(S.tab==="me")return pg("預約與資料設定")+`<div class="card">${cfgB()}</div><div class="card" data-f><h4 style="margin-top:0">教練資料</h4>${field("name","姓名","text",c.name)}${field("nick","綽號","text",c.nick)}${field("phone","電話","tel",c.phone)}<label>個人經歷（可換行）</label><textarea name="bio" rows="4">${esc(c.bio)}</textarea><label>個人照</label><input name="photo" type="file" accept="image/*">${field("place","預設上課地點","text",db.cfg.place)}<label class="ck"><input type="checkbox" name="gcal" ${c.gcal?"checked":""}>Google 行事曆連動</label><button class="btn" data-act="saveCoach">儲存</button></div>`;
const cf=cfg();
return brand("教練區")+head+`<div class="seg">${seg}</div><div class="cal">${cal}</div><div class="sec"><b>約課申請</b>${pend.length?`<i class="cnt">${pend.length}</i>`:""}</div>${reqCards()}<div class="card mn">${mrow("users","我的學員",Object.keys(db.students).length+" 人","stu")}${mrow("cal","預約設定",cf.open+"–"+cf.close,"me")}${mrow("gear","教練資料與設定","","me")}</div>`}
/* ===== 渲染 ===== */
function render(){
const open=new Set([...document.querySelectorAll("details[open]")].map(d=>d.dataset.k));
let h,tabs=null,pend=false;
if(S.coachMode){if(!db.coach)h=onboardC();else if(db.coach.uid!==S.uid)h=brand("教練區")+`<div class="card"><h1>無法進入</h1><p class="sm2">這個連結只提供教練使用。</p></div>`;else{S.tab=S.tab||"sch";h=coachBody();tabs=CT;pend=db.requests.some(r=>r.status==="pending")}}
else if(!db.students[S.uid])h=onboardS();else{S.tab=S.tab||"home";h=studentBody();tabs=ST}
if(S.demo)h+=`<footer>示範模式（資料只存在這支瀏覽器）<br><a href="?">學員視角</a>・<a href="?role=coach">教練視角</a>・<a href="#" data-act="newStu">換成新學員</a>・<a href="#" data-act="reset">清除資料</a></footer>`;
app.innerHTML=h+(tabs?tabBar(tabs,pend):"");
document.querySelectorAll("details").forEach(d=>{if(open.has(d.dataset.k))d.open=true});
}
/* ===== 事件 ===== */
const rd=f=>Object.fromEntries([...f.querySelectorAll("[name]")].map(i=>[i.name,i.type==="checkbox"?i.checked:i.value.trim()]));
const photoOf=file=>new Promise(res=>{if(!file)return res(null);const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=240/Math.min(im.width,im.height);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)});
document.addEventListener("click",async e=>{
const b=e.target.closest("[data-act]");if(!b||b.type==="checkbox")return;
const a=b.dataset.act,f=b.closest("[data-f]"),d=f?rd(f):{},sid=f?.dataset.sid,id=b.closest("[data-id]")?.dataset.id;
if(a==="theme"){const v=b.dataset.v,u=S.coachMode?db.coach:db.students[S.uid];if(u){u.theme=v;commit()}else{S.tmp=v;document.documentElement.dataset.th=v;document.querySelectorAll(".tc").forEach(x=>x.classList.toggle("on",x.dataset.v===v))}return}
if(a==="newStu"){e.preventDefault();localStorage.cb_uid="U"+rid();location.href="?";return}
if(a==="reset"){e.preventDefault();if(confirm("確定清除所有示範資料？")){localStorage.clear();location.href="?"}return}
if(["cv","goto","nav"].includes(a))S.edit=null;
if(a==="edit"){S.edit=id;return render()}
if(a==="cancelEdit"){S.edit=null;return render()}
if(a==="expcells"){S.exp[b.dataset.pid]=!S.exp[b.dataset.pid];return render()}
if(a==="histall"){S.hist=!S.hist;return render()}
if(a==="tab"){S.tab=b.dataset.v;S.edit=null;if(S.tab!=="book")S.bk=null;window.scrollTo&&window.scrollTo(0,0);return render()}
if(a==="today"){S.cd=new Date();return render()}
if(a==="pick"){S.pk[b.dataset.rid]=+b.dataset.i;return render()}
if(a==="bkact"){if(!e.target.closest("select")){S.bk.act=+b.dataset.i;render()}return}
if(a==="bkday"){setD(S.bk.same?0:S.bk.act,b.dataset.d);return render()}
if(a==="bkclr"){e.stopPropagation&&e.stopPropagation();const i=+b.dataset.i;S.bk.d[i]="";S.bk.t[i]="";return render()}
if(a==="bkw"){const m=Math.max(0,Math.min((db.cfg.maxDays||30)-6,S.bk.ws+7*(+b.dataset.v)));S.bk.ws=m;return render()}
if(a==="more"){S.more=!S.more;return render()}
if(a==="cv"){S.cv=b.dataset.v;return render()}
if(a==="goto"){S.cd=new Date(b.dataset.d);S.cv="d";return render()}
if(a==="nav"){const v=+b.dataset.v,x=new Date(S.cd);if(S.cv==="d")x.setDate(x.getDate()+v);else if(S.cv==="w")x.setDate(x.getDate()+7*v);else{x.setDate(1);x.setMonth(x.getMonth()+v)}S.cd=x;return render()}
const need=(...k)=>k.every(x=>d[x])||(alert("請填寫完整"),false);
if(a==="regStudent"){if(!need("name","phone","birthday"))return;db.students[S.uid]={name:d.name,phone:d.phone,gender:d.gender,birthday:d.birthday,gcal:d.gcal,theme:S.tmp||"r"};FIRST=true}
if(a==="regCoach"){if(!need("name","phone"))return;db.coach={uid:S.uid,name:d.name,nick:d.nick,phone:d.phone,gender:d.gender,bio:d.bio,gcal:d.gcal,theme:S.tmp||"r",photo:await photoOf(f.querySelector("[name=photo]").files[0])};FIRST=true}
if(a==="saveCoach"){const p=await photoOf(f.querySelector("[name=photo]").files[0]);Object.assign(db.coach,{name:d.name,nick:d.nick,phone:d.phone,bio:d.bio,gcal:d.gcal});if(p)db.coach.photo=p;db.cfg.place=d.place}
if(a==="req"){const B=S.bk;if(!B)return;const t=[];for(const i of[0,1,2]){if(B.d[i]&&B.t[i])t.push(new Date(B.d[i]+"T"+B.t[i]).toISOString());else if(B.t[i]||(B.d[i]&&!B.same))return alert("第"+"一二三"[i]+"志願的日期和時間要一起選")}
if(!t.length)return alert("請至少選 1 個志願時段");if(new Set(t).size<t.length)return alert("時段不可重複");if(t.some(x=>!okSlot(x)))return alert("所選時段目前不開放，請重新選擇");
const r=db.requests.find(x=>x.sid===S.uid&&x.status==="pending");if(r){r.times=t;r.at=Date.now()}else db.requests.push({id:rid(),sid:S.uid,times:t,status:"pending",at:Date.now()});S.bk=null;alert("已送出約課申請，請等候教練確認")}
if(a==="confirmReq"){const r=db.requests.find(x=>x.id===f.dataset.rid),t=r.times[+b.dataset.i],clash=db.lessons.some(l=>l.status==="scheduled"&&Math.abs(new Date(l.start)-new Date(t))<LEN*6e4);
if(!confirm(`確認安排「${db.students[r.sid]?.name||""}」上課？\n\n時間：${fmt(t)}\n地點：${d.place||"未填"}`+(clash?"\n\n⚠ 這個時段與其他已預約的課程重疊":"")))return;
r.status="confirmed";db.lessons.push({id:rid(),sid:r.sid,start:t,place:d.place,status:"scheduled"})}
if(a==="rejectReq"){db.requests.find(x=>x.id===f.dataset.rid).status="rejected"}
if(a==="addLesson"){if(!need("sd","st"))return;db.lessons.push({id:rid(),sid,start:new Date(d.sd+"T"+d.st).toISOString(),place:d.place,status:"scheduled"})}
if(a==="saveCfg"){if(tm(d.close)-tm(d.open)<LEN)return alert("結束時間至少要比開始時間晚 "+LEN+" 分鐘");Object.assign(db.cfg,{open:d.open,close:d.close,maxDays:Math.max(1,+d.maxDays||30),offWd:[0,1,2,3,4,5,6].filter(w=>d["wd"+w])})}
if(a==="addBlock"){if(tm(d.bto)<=tm(d.bfrom))return alert("結束時間需晚於開始時間");db.cfg.blocks=(db.cfg.blocks||[]).concat({id:rid(),wd:d.bwd,from:d.bfrom,to:d.bto})}
if(a==="delBlock"){db.cfg.blocks=(db.cfg.blocks||[]).filter(x=>x.id!==b.dataset.bid)}
if(a==="addOff"){if(!need("od"))return;db.cfg.offDates=[...new Set([...(db.cfg.offDates||[]),d.od])].sort()}
if(a==="delOff"){db.cfg.offDates=(db.cfg.offDates||[]).filter(x=>x!==b.dataset.od)}
if(a==="done"){const l=db.lessons.find(x=>x.id===id);if(!confirm(`確認「${db.students[l.sid]?.name||""}」${fmt(l.start)} 這堂課已完課？\n\n完課後會從課程期數扣除 1 堂。`))return;l.status="done"}
if(a==="cancel"){const l=db.lessons.find(x=>x.id===id);if(!confirm(`確定取消「${db.students[l.sid]?.name||""}」${fmt(l.start)} 的課程？\n\n取消後會從行事曆移除。`))return;db.lessons=db.lessons.filter(x=>x.id!==id)}
if(a==="saveEdit"){if(!need("sd","st"))return;const l=db.lessons.find(x=>x.id===id),t=new Date(d.sd+"T"+d.st).toISOString(),clash=db.lessons.some(x=>x.id!==id&&x.status==="scheduled"&&Math.abs(new Date(x.start)-new Date(t))<LEN*6e4);
if(!confirm(`確認修改「${db.students[l.sid]?.name||""}」的課程？\n\n原時間：${fmt(l.start)}\n新時間：${fmt(t)}\n地點：${d.place||"未填"}`+(clash?"\n\n⚠ 這個時段與其他已預約的課程重疊":"")))return;l.start=t;l.place=d.place;S.cd=new Date(t);S.edit=null}
if(a==="addPkg"){if(!need("fee","total","paid"))return;db.packages.push({id:rid(),sid,term:db.packages.filter(p=>p.sid===sid).length+1,fee:+d.fee,total:+d.total,paid:d.paid,method:d.method})}
if(a==="addNote"){if(!need("text"))return;db.notes.push({sid,text:d.text,ts:Date.now()})}
commit();
});
const setD=(i,v)=>{const B=S.bk,f=j=>{B.d[j]=v;if(B.t[j]&&!(v&&slots(v).includes(B.t[j])))B.t[j]=""};if(B.same)[0,1,2].forEach(f);else f(i)};
document.addEventListener("change",e=>{const t=e.target,B=S.bk,n=t.name||"";
if(t.dataset&&t.dataset.act==="gcalToggle"){db.students[S.uid].gcal=t.checked;return commit()}
if(!B)return;
if(/^bd\d$/.test(n)){setD(+n[2],t.value);render()}
else if(/^bt\d$/.test(n)){B.t[+n[2]]=t.value;render()}
else if(n==="same"){B.same=t.checked;if(t.checked)setD(0,B.d.find(x=>x)||"");render()}});
/* ===== 啟動 ===== */
const step=t=>{app.innerHTML=`<p class="sm2" style="padding:40px 0;text-align:center">${esc(t)}</p>`};
(async function init(){
S.coachMode=/role(=|%3D)coach/.test(location.href);
if(CONFIG.LIFF_ID){
try{
if(typeof liff==="undefined")throw new Error("LINE LIFF SDK 載入失敗，請檢查網路後重試");
step("連線 LINE…");
await Promise.race([liff.init({liffId:CONFIG.LIFF_ID}),new Promise((_,rej)=>setTimeout(()=>rej(new Error("LIFF 初始化逾時，請確認 LIFF Endpoint URL 與網址相符")),10000))]);
if(!liff.isLoggedIn()){liff.login();return}
step("取得使用者資料…");
const p=await liff.getProfile();S.uid=p.userId;S.lineName=p.displayName;
}catch(err){console.error(err);app.innerHTML=`<h1>無法開啟</h1><p class="sm2">LINE 登入初始化失敗：</p><p class="sm2">${esc(err.message||err)}</p>`;return}
}
if(!S.uid)S.uid=new URLSearchParams(location.search).get("uid")||localStorage.cb_uid||(localStorage.cb_uid="U"+rid());
step("載入畫面…");
render();
})();
</script>
